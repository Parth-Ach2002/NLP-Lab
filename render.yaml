services:
  - type: web
    name: paper-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python prefetch.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_CACHE
        value: /opt/render/project/src/model_cache
